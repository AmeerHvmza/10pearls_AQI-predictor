[theme]
base = "light"

# Deep forest green on white: the accent carries all UI chrome (buttons,
# checkboxes, sliders, links, active states) and the "Good" AQI band, while
# the remaining EPA severity hues (yellow -> maroon) stay untouched so the
# scale is still readable. primaryColor is 12.2:1 against the background.
primaryColor = "#1F3B2C"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F6F4"
textColor = "#212121"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false

[client]
# Hide the built-in Deploy control; we replace it with a Reload action
# on the forest-green top bar.
toolbarMode = "viewer"
